<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Vault | سجل الأنماط الفاخر</title>

    <style>
        :root {
            --bg-color: #07070b;
            --glass-bg: linear-gradient(135deg, rgba(255, 215, 0, 0.07) 0%, rgba(20, 20, 30, 0.6) 100%);
            --glass-border: rgba(255, 215, 0, 0.25);
            --gold: #f39c12;
            --gold-bright: #ffd700;
            --gold-glow: 0 0 20px rgba(255, 215, 0, 0.5);
            --danger: #ff4757;
            --danger-glow: 0 0 15px rgba(255, 71, 87, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 10%, #1a1500 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, #0d0d1a 0%, #07070b 100%);
        }

        #main-app {
            display: block;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 15px;
        }

        header h1 {
            color: var(--gold-bright);
            text-shadow: var(--gold-glow);
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* أزرار النسخ الاحتياطي */
        .backup-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-backup {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--gold-bright);
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-backup:active {
            transform: scale(0.97);
            background: rgba(255, 215, 0, 0.15);
        }

        /* شبكة الرسم الفاخرة */
                    .pattern-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 25px auto;
            background: var(--glass-bg);
            border-radius: 28px;
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.03);
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 28px;
            gap: 20px;
            position: absolute;
            z-index: 2;
        }

        .dot {
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .dot::after {
            content: '';
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            border-radius: 50%;
            opacity: 0.3;
            transform: scale(0.6);
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .dot.active {
            border-color: var(--gold-bright);
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, rgba(0,0,0,0.6) 100%);
            box-shadow: var(--gold-glow), inset 0 0 8px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }

        .dot.active::after {
            opacity: 1;
            transform: scale(1.2);
            box-shadow: 0 0 15px var(--gold-bright);
        }

        #lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
        }

        /* أدوات الحفظ */
        .controls {
            background: var(--glass-bg);
            padding: 22px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .controls input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .controls input[type="text"]:focus {
            border-color: var(--gold-bright);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-container input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--danger);
            cursor: pointer;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn-save { 
            background: linear-gradient(135deg, var(--gold-bright), var(--gold)); 
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .btn-save:active {
            transform: scale(0.97);
        }

        .btn-clear { 
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            border: 1px solid var(--glass-border);
        }

        .btn-clear:active {
            transform: scale(0.97);
        }

        /* سجل الأنماط */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 30px;
        }

        .pattern-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .pattern-card.suspicious {
            border-color: var(--danger);
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.08) 0%, rgba(20, 20, 30, 0.6) 100%);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.15);
        }

        .pattern-preview {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pattern-info {
            flex: 1;
            margin-right: 15px;
        }

        .pattern-info h3 { font-size: 16px; margin-bottom: 6px; color: var(--gold-bright); }
        .pattern-info p { font-size: 11px; color: #888; }
        .pattern-info .badge {
            display: inline-block;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 6px;
            box-shadow: var(--danger-glow);
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            transition: 0.2s;
        }

        .btn-delete:active {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="main-app">
        <header>
            <h1>Pattern Vault</h1>
            <p style="font-size: 12px; color: #777; margin-top: 4px;">تصميم فاخر • حفظ محلي آمن • نسخة احتياطية</p>
        </header>

        <!-- أزرار النسخ الاحتياطي -->
        <div class="backup-bar">
            <button class="btn-backup" onclick="exportBackup()">📥 تحميل النسخة الاحتياطية</button>
            <button class="btn-backup" onclick="document.getElementById('import-file').click()">📤 استعادة النسخة</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importBackup(event)">
        </div>

        <!-- منطقة الرسم الفاخرة -->
        <div class="pattern-container" id="pattern-container">
            <svg id="lines-svg"></svg>
            <div class="grid" id="grid">
                <div class="dot" data-id="1"></div><div class="dot" data-id="2"></div><div class="dot" data-id="3"></div>
                <div class="dot" data-id="4"></div><div class="dot" data-id="5"></div><div class="dot" data-id="6"></div>
                <div class="dot" data-id="7"></div><div class="dot" data-id="8"></div><div class="dot" data-id="9"></div>
            </div>
        </div>

        <!-- أدوات الحفظ -->
        <div class="controls">
            <input type="text" id="pattern-name" placeholder="اسم أو ملاحظة للنمط (اختياري)">
            <label class="checkbox-container">
                <input type="checkbox" id="is-suspicious">
                <span>وسم كـ نمط مشبوه ⚠️</span>
            </label>
            <div class="buttons-row">
                <button class="btn btn-save" onclick="savePattern()">حفظ النمط</button>
                <button class="btn btn-clear" onclick="clearPattern()">مسح الرسم</button>
            </div>
        </div>

        <!-- السجل -->
        <h3 style="color: var(--gold-bright); margin-bottom: 15px; font-size: 17px;">الأنماط المخزنة محلياً</h3>
        <div class="history-list" id="history-list"></div>
    </div>

    <script>
        let currentPattern = [];
        let isDragging = false;
        const grid = document.getElementById('grid');
        const linesSvg = document.getElementById('lines-svg');
        const container = document.getElementById('pattern-container');

        loadPatterns();

        function getDotCenter(dot) {
            const containerRect = container.getBoundingClientRect();
            const dotRect = dot.getBoundingClientRect();
            return {
                x: dotRect.left - containerRect.left + dotRect.width / 2,
                y: dotRect.top - containerRect.top + dotRect.height / 2
            };
        }

        function drawLine(dot1, dot2) {
            const pos1 = getDotCenter(dot1);
            const pos2 = getDotCenter(dot2);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pos1.x);
            line.setAttribute('y1', pos1.y);
            line.setAttribute('x2', pos2.x);
            line.setAttribute('y2', pos2.y);
            line.setAttribute('stroke', '#ffd700');
            line.setAttribute('stroke-width', '5');
            line.setAttribute('stroke-linecap', 'round');
            linesSvg.appendChild(line);
        }

        function addDotToPattern(dot) {
            const dotId = dot.getAttribute('data-id');
            if (!currentPattern.includes(dotId)) {
                currentPattern.push(dotId);
                dot.classList.add('active');
                
                if (currentPattern.length > 1) {
                    const prevDotId = currentPattern[currentPattern.length - 2];
                    const prevDot = document.querySelector(`.dot[data-id="${prevDotId}"]`);
                    drawLine(prevDot, dot);
                }
            }
        }

        grid.addEventListener('mousedown', (e) => { isDragging = true; handleInteraction(e); });
        grid.addEventListener('touchstart', (e) => { isDragging = true; handleInteraction(e.touches[0]); }, {passive: false});
        
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        grid.addEventListener('mousemove', (e) => { if(isDragging) handleInteraction(e); });
        grid.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(isDragging) handleInteraction(e.touches[0]);
        }, {passive: false});

        function handleInteraction(event) {
            const element = document.elementFromPoint(event.clientX, event.clientY);
            if (element && element.classList.contains('dot')) {
                addDotToPattern(element);
            }
        }

        function clearPattern() {
            currentPattern = [];
            linesSvg.innerHTML = '';
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        }

        function savePattern() {
            if (currentPattern.length < 4) {
                alert("النمط قصير جداً! يجب أن يحتوي على 4 نقاط على الأقل.");
                return;
            }

            const name = document.getElementById('pattern-name').value || "بدون اسم";
            const isSuspicious = document.getElementById('is-suspicious').checked;
            const patternString = currentPattern.join('-');

            const newPattern = {
                id: Date.now().toString(),
                name: name,
                pattern: patternString,
                suspicious: isSuspicious,
                date: new Date().toLocaleString('ar-EG')
            };

            let patterns = JSON.parse(localStorage.getItem('my_patterns') || '[]');
            patterns.unshift(newPattern);
            localStorage.setItem('my_patterns', JSON.stringify(patterns));

            clearPattern();
            document.getElementById('pattern-name').value = '';
            document.getElementById('is-suspicious').checked = false;
            loadPatterns();
        }

        function loadPatterns() {
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';
            
            let patterns = JSON.parse(localStorage.getItem('my_patterns') || '[]');
            
            if (patterns.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#555; font-size:13px; padding: 20px;">لا توجد أنماط مخزنة بعد</p>';
                return;
            }

            patterns.forEach(data => {
                const card = document.createElement('div');
                card.className = `pattern-card ${data.suspicious ? 'suspicious' : ''}`;
                
                const svgPreview = generateMiniPattern(data.pattern, data.suspicious);

                card.innerHTML = `
                    <div class="pattern-preview">${svgPreview}</div>
                    <div class="pattern-info">
                        <h3>${data.name}</h3>
                        <p>${data.date}</p>
                        ${data.suspicious ? '<span class="badge">مشبوه ⚠️</span>' : ''}
                    </div>
                    <button class="btn-delete" onclick="deletePattern('${data.id}')">✖</button>
                `;
                listDiv.appendChild(card);
            });
        }

        function deletePattern(id) {
            if(confirm("هل أنت متأكد من حذف هذا النمط؟")) {
                let patterns = JSON.parse(localStorage.getItem('my_patterns') || '[]');
                patterns = patterns.filter(p => p.id !== id);
                localStorage.setItem('my_patterns', JSON.stringify(patterns));
                loadPatterns();
            }
        }

        function exportBackup() {
            let patterns = localStorage.getItem('my_patterns') || '[]';
            let blob = new Blob([patterns], {type: "application/json"});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = "pattern-vault-backup.json";
            a.click();
        }

        function importBackup(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        localStorage.setItem('my_patterns', JSON.stringify(importedData));
                        loadPatterns();
                        alert("تمت استعادة النسخة الاحتياطية بنجاح! ✅");
                    } else {
                        alert("الملف غير صالح!");
                    }
                } catch (err) {
                    alert("حدث خطأ أثناء قراءة الملف.");
                }
            };
            reader.readAsText(file);
        }

        function generateMiniPattern(patternString, isSuspicious) {
            const dots = patternString.split('-');
            const color = isSuspicious ? '#ff4757' : '#ffd700';
            let svg = `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">`;
            
            for(let i=0; i < dots.length - 1; i++) {
                const p1 = getMiniCoords(dots[i]);
                const p2 = getMiniCoords(dots[i+1]);
                svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${color}" stroke-width="4" stroke-linecap="round" opacity="0.7"/>`;
            }
            
            dots.forEach(dot => {
                const p = getMiniCoords(dot);
                svg += `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${color}" />`;
            });
            
            svg += `</svg>`;
            return svg;
        }

        function getMiniCoords(id) {
            const col = (id - 1) % 3;
            const row = Math.floor((id - 1) / 3);
            return { x: 20 + (col * 30), y: 20 + (row * 30) };
        }
    </script>
</body>
</html>
