<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Vault | سجل الأنماط السري</title>
    
    <!-- مكتبات Firebase (الإصدار المتوافق مع HTML المباشر) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0d0d12;
            --glass-bg: rgba(255, 215, 0, 0.05);
            --glass-border: rgba(255, 215, 0, 0.2);
            --gold: #d4af37;
            --gold-glow: 0 0 15px rgba(212, 175, 55, 0.4);
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, #0d0d12 100%);
        }

        /* --- التطبيق الرئيسي --- */
        #main-app {
            display: block;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        header h1 {
            color: var(--gold);
            text-shadow: var(--gold-glow);
            font-size: 24px;
        }

        /* شبكة الرسم */
        .pattern-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px auto;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            touch-action: none; /* لمنع التمرير أثناء الرسم */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 15px;
            position: absolute;
            z-index: 2;
        }

        .dot {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .dot::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            transition: 0.2s;
        }

        .dot.active {
            border-color: var(--gold);
            box-shadow: var(--gold-glow);
        }

        .dot.active::after {
            opacity: 1;
        }

        #lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* أدوات الحفظ */
        .controls {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 30px;
        }

        .controls input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--danger);
        }

        .buttons-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save { background: var(--gold); color: black; }
        .btn-clear { background: rgba(255, 255, 255, 0.1); color: white; }

        /* سجل الأنماط */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pattern-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pattern-card.suspicious {
            border-color: var(--danger);
            background: rgba(255, 68, 68, 0.05);
        }

        .pattern-preview {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            position: relative;
        }

        .pattern-info {
            flex: 1;
            margin-right: 15px;
        }

        .pattern-info h3 { font-size: 16px; margin-bottom: 5px; color: var(--gold); }
        .pattern-info p { font-size: 12px; color: #aaa; }
        .pattern-info .badge {
            display: inline-block;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 5px;
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <!-- التطبيق الأساسي (يفتح مباشرة بدون تسجيل دخول) -->
    <div id="main-app">
        <header>
            <h1>Pattern Vault</h1>
            <p style="font-size: 12px; color: #888; margin-top: 5px;">اضغط على المربعات بالترتيب أو اسحب لرسم النمط</p>
        </header>

        <!-- منطقة الرسم -->
        <div class="pattern-container" id="pattern-container">
            <svg id="lines-svg"></svg>
            <div class="grid" id="grid">
                <!-- المربعات من 1 إلى 9 -->
                <div class="dot" data-id="1"></div><div class="dot" data-id="2"></div><div class="dot" data-id="3"></div>
                <div class="dot" data-id="4"></div><div class="dot" data-id="5"></div><div class="dot" data-id="6"></div>
                <div class="dot" data-id="7"></div><div class="dot" data-id="8"></div><div class="dot" data-id="9"></div>
            </div>
        </div>

        <!-- أدوات الحفظ -->
        <div class="controls">
            <input type="text" id="pattern-name" placeholder="اسم أو ملاحظة للنمط (اختياري)">
            <label class="checkbox-container">
                <input type="checkbox" id="is-suspicious">
                <span>وسم كـ نمط مشبوه ⚠️</span>
            </label>
            <div class="buttons-row">
                <button class="btn btn-save" onclick="savePattern()">حفظ النمط</button>
                <button class="btn btn-clear" onclick="clearPattern()">مسح الرسم</button>
            </div>
        </div>

        <!-- السجل -->
        <h3 style="color: var(--gold); margin-bottom: 15px; text-align: right;">الأنماط المخزنة</h3>
        <div class="history-list" id="history-list">
            <!-- سيتم إضافة الأنماط هنا عبر JavaScript -->
        </div>
    </div>

    <script>
        // 1. إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBF9Xdqtg_0buaalRYHZJau-GY0Us5vkRA",
            authDomain: "pattern-8ba7c.firebaseapp.com",
            projectId: "pattern-8ba7c",
            storageBucket: "pattern-8ba7c.firebasestorage.app",
            messagingSenderId: "842871744550",
            appId: "1:842871744550:web:e1338ffdfca5405c665ee7"
        };

        // تهيئة الاتصال بقاعدة البيانات مباشرة بدون Auth
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // تحميل البيانات فور فتح الصفحة
        loadPatterns();

        // 2. نظام رسم النمط (يدعم السحب والضغط نقطة بنقطة)
        let currentPattern = [];
        let isDragging = false;
        const grid = document.getElementById('grid');
        const linesSvg = document.getElementById('lines-svg');
        const container = document.getElementById('pattern-container');

        // الحصول على مركز النقطة بالنسبة للكونتينر لرسم الخط
        function getDotCenter(dot) {
            const containerRect = container.getBoundingClientRect();
            const dotRect = dot.getBoundingClientRect();
            return {
                x: dotRect.left - containerRect.left + dotRect.width / 2,
                y: dotRect.top - containerRect.top + dotRect.height / 2
            };
        }

        // رسم خط بين نقطتين
        function drawLine(dot1, dot2) {
            const pos1 = getDotCenter(dot1);
            const pos2 = getDotCenter(dot2);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pos1.x);
            line.setAttribute('y1', pos1.y);
            line.setAttribute('x2', pos2.x);
            line.setAttribute('y2', pos2.y);
            line.setAttribute('stroke', '#d4af37');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            linesSvg.appendChild(line);
        }

        // إضافة نقطة للنمط الحالي
        function addDotToPattern(dot) {
            const dotId = dot.getAttribute('data-id');
            if (!currentPattern.includes(dotId)) {
                currentPattern.push(dotId);
                dot.classList.add('active');
                
                // إذا كان هناك نقطة سابقة، ارسم خطاً بينهما
                if (currentPattern.length > 1) {
                    const prevDotId = currentPattern[currentPattern.length - 2];
                    const prevDot = document.querySelector(`.dot[data-id="${prevDotId}"]`);
                    drawLine(prevDot, dot);
                }
            }
        }

        // أحداث اللمس والماوس
        grid.addEventListener('mousedown', (e) => { isDragging = true; handleInteraction(e); });
        grid.addEventListener('touchstart', (e) => { isDragging = true; handleInteraction(e.touches[0]); }, {passive: false});
        
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        grid.addEventListener('mousemove', (e) => { if(isDragging) handleInteraction(e); });
        grid.addEventListener('touchmove', (e) => {
            e.preventDefault(); // منع تمرير الشاشة
            if(isDragging) handleInteraction(e.touches[0]);
        }, {passive: false});

        function handleInteraction(event) {
            const element = document.elementFromPoint(event.clientX, event.clientY);
            if (element && element.classList.contains('dot')) {
                addDotToPattern(element);
            }
        }

        // مسح الرسم
        function clearPattern() {
            currentPattern = [];
            linesSvg.innerHTML = '';
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        }

        // 3. الحفظ في السحابة
        function savePattern() {
            if (currentPattern.length < 4) {
                alert("النمط قصير جداً! يجب أن يحتوي على 4 نقاط على الأقل.");
                return;
            }

            const name = document.getElementById('pattern-name').value || "بدون اسم";
            const isSuspicious = document.getElementById('is-suspicious').checked;
            const patternString = currentPattern.join('-');

            db.collection("patterns").add({
                name: name,
                pattern: patternString,
                suspicious: isSuspicious,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                clearPattern();
                document.getElementById('pattern-name').value = '';
                document.getElementById('is-suspicious').checked = false;
            }).catch(error => {
                alert("حدث خطأ أثناء الحفظ");
                console.error(error);
            });
        }

        // 4. جلب وعرض الأنماط من السحابة
        function loadPatterns() {
            db.collection("patterns").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const listDiv = document.getElementById('history-list');
                listDiv.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = `pattern-card ${data.suspicious ? 'suspicious' : ''}`;
                    
                    // تحويل السلسلة لنقاط مصغرة (SVG صغير)
                    const svgPreview = generateMiniPattern(data.pattern, data.suspicious);
                    
                    const timeString = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('ar-EG') : 'الآن';

                    card.innerHTML = `
                        <div class="pattern-preview">${svgPreview}</div>
                        <div class="pattern-info">
                            <h3>${data.name}</h3>
                            <p>${timeString}</p>
                            ${data.suspicious ? '<span class="badge">مشبوه ⚠️</span>' : ''}
                        </div>
                        <button class="btn-delete" onclick="deletePattern('${doc.id}')">✖</button>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        // حذف نمط
        function deletePattern(id) {
            if(confirm("هل أنت متأكد من حذف هذا النمط؟")) {
                db.collection("patterns").doc(id).delete();
            }
        }

        // توليد رسمة مصغرة للأنماط المحفوظة
        function generateMiniPattern(patternString, isSuspicious) {
            const dots = patternString.split('-');
            const color = isSuspicious ? '#ff4444' : '#d4af37';
            let svg = `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">`;
            
            // رسم خطوط الميني
            for(let i=0; i < dots.length - 1; i++) {
                const p1 = getMiniCoords(dots[i]);
                const p2 = getMiniCoords(dots[i+1]);
                svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${color}" stroke-width="4" stroke-linecap="round" opacity="0.6"/>`;
            }
            
            // رسم نقاط الميني
            dots.forEach(dot => {
                const p = getMiniCoords(dot);
                svg += `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${color}" />`;
            });
            
            svg += `</svg>`;
            return svg;
        }

        function getMiniCoords(id) {
            const col = (id - 1) % 3;
            const row = Math.floor((id - 1) / 3);
            return { x: 20 + (col * 30), y: 20 + (row * 30) };
        }
    </script>
</body>
</html>
